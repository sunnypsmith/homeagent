# ---------------------------------------------------------------
# Atom Echo Voice Mic — ESPHome firmware
#
# Streams raw 16kHz 16-bit mono PCM over UDP to the voice service.
# No on-device wake word detection; all processing is server-side.
#
# Per-device substitutions (override when flashing each unit):
#   node_name         unique device name on the network
#   friendly_name     human-readable label
#   room_id           4-char room code (sent as UDP header)
#   voice_server_ip   IP of the voice service host
#   voice_server_port UDP port the voice service listens on
#   voice_listen_port UDP port THIS device listens on for TTS audio
# ---------------------------------------------------------------

substitutions:
  node_name: "atom-echo-office"
  friendly_name: "Office Voice Mic"
  room_id: "offi"                    # 4 chars max
  voice_server_ip: "10.1.1.110"
  voice_server_port: "9100"
  voice_listen_port: "9200"          # unique per device for TTS responses
  mic_gain: "8"                      # amplification factor (try 4-16)

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  includes:
    - udp_streamer.h
  on_boot:
    priority: -10
    then:
      - lambda: |-
          udp_streamer_init("${voice_server_ip}", ${voice_server_port},
                            ${voice_listen_port}, "${room_id}");
          udp_streamer_set_gain(${mic_gain});
          udp_streamer_start();
      - delay: 2s
      - microphone.capture: mic
      - light.turn_on:
          id: led
          red: 0%
          green: 50%
          blue: 0%
          brightness: 30%
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32_DEFAULT_CPU_FREQ_240: "y"

logger:
  level: INFO
  baud_rate: 0

debug:
  update_interval: 5s

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      manual_ip:
        static_ip: 10.1.2.158
        gateway: 10.1.2.254
        subnet: 255.255.252.0
        dns1: 10.1.2.254
  power_save_mode: none
  output_power: 20.5dB

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

text_sensor:
  - platform: debug
    device:
      name: "Office Voice Mic Device Info"
      entity_category: diagnostic
      id: office_device_info
    reset_reason:
      name: "Office Voice Mic Reset Reason"
      entity_category: diagnostic
      id: office_reset_reason
  - platform: wifi_info
    ip_address:
      name: "Office Voice Mic IP"
      entity_category: diagnostic
      id: office_ip
    ssid:
      name: "Office Voice Mic SSID"
      entity_category: diagnostic
      id: office_ssid
    bssid:
      name: "Office Voice Mic BSSID"
      entity_category: diagnostic
      id: office_bssid
    mac_address:
      name: "Office Voice Mic MAC"
      entity_category: diagnostic
      id: office_mac

sensor:
  - platform: wifi_signal
    name: "Office Voice Mic WiFi Signal"
    update_interval: 15s
    entity_category: diagnostic
    id: office_wifi_signal
  - platform: uptime
    name: "Office Voice Mic Uptime"
    update_interval: 15s
    entity_category: diagnostic
    id: office_uptime
  - platform: debug
    free:
      name: "Office Voice Mic Heap Free"
      entity_category: diagnostic
      id: office_heap_free
    block:
      name: "Office Voice Mic Heap Max Block"
      entity_category: diagnostic
      id: office_heap_block
    min_free:
      name: "Office Voice Mic Heap Min Free"
      entity_category: diagnostic
      id: office_heap_min_free
    fragmentation:
      name: "Office Voice Mic Heap Fragmentation"
      entity_category: diagnostic
      id: office_heap_fragmentation
    loop_time:
      name: "Office Voice Mic Loop Time"
      entity_category: diagnostic
      id: office_loop_time
    cpu_frequency:
      name: "Office Voice Mic CPU Frequency"
      entity_category: diagnostic
      id: office_cpu_frequency

# ----- Status LED (SK6812 NeoPixel) -----
light:
  - platform: esp32_rmt_led_strip
    id: led
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    rgb_order: GRB
    name: "Status LED"

# ----- I2S Audio Bus -----
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO33
    i2s_bclk_pin: GPIO19

# ----- Microphone (PDM) -----
microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO23
    adc_type: external
    pdm: true
    channel: right
    bits_per_sample: 16bit
    sample_rate: 16000
    on_data:
      - lambda: |-
          stream_audio_udp(x);

# ----- Speaker (for TTS responses) -----
speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO21
    dac_type: external
    i2s_mode: primary

# ----- Physical Button (GPIO39) -----
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: "Button"
    id: button
    on_press:
      then:
        # Blue = push-to-talk active
        - light.turn_on:
            id: led
            red: 0%
            green: 0%
            blue: 100%
            brightness: 80%
    on_release:
      then:
        # Back to idle green
        - light.turn_on:
            id: led
            red: 0%
            green: 50%
            blue: 0%
            brightness: 30%

# ----- MQTT (for button events + LED control from server) -----
mqtt:
  id: mqtt_client
  broker: ${voice_server_ip}
  port: 1883
  topic_prefix: "homeagent/voice/${room_id}"
  birth_message:
    topic: "homeagent/voice/${room_id}/status"
    payload: "online"
    retain: true
  will_message:
    topic: "homeagent/voice/${room_id}/status"
    payload: "offline"
    retain: true
  on_message:
    # LED control from voice service
    - topic: "homeagent/voice/${room_id}/led"
      then:
        - lambda: |-
            std::string color = x;
            if (color == "listening") {
              auto call = id(led).turn_on();
              call.set_rgb(0.0f, 0.5f, 0.0f);
              call.set_brightness(0.3f);
              call.perform();
            } else if (color == "wake") {
              auto call = id(led).turn_on();
              call.set_rgb(0.0f, 0.0f, 1.0f);
              call.set_brightness(0.8f);
              call.perform();
            } else if (color == "capturing") {
              auto call = id(led).turn_on();
              call.set_rgb(0.0f, 1.0f, 0.0f);
              call.set_brightness(0.8f);
              call.perform();
            } else if (color == "processing") {
              auto call = id(led).turn_on();
              call.set_rgb(1.0f, 0.8f, 0.0f);
              call.set_brightness(0.6f);
              call.perform();
            } else if (color == "error") {
              auto call = id(led).turn_on();
              call.set_rgb(1.0f, 0.0f, 0.0f);
              call.set_brightness(0.8f);
              call.perform();
            } else if (color == "off") {
              id(led).turn_off().perform();
            }
    # Button state published automatically by the binary_sensor,
    # but also publish explicitly for the voice service:
  on_json_message:
    topic: "homeagent/voice/${room_id}/play"
    then:
      - lambda: |-
          // Future: receive TTS audio URL or data to play on speaker
          ESP_LOGI("voice", "Play command received");

# Publish button press/release to MQTT for push-to-talk
interval:
  - interval: 200ms
    then:
      - lambda: |-
          static bool last_state = false;
          bool current = id(button).state;
          if (current != last_state) {
            last_state = current;
            if (current) {
              id(mqtt_client).publish("homeagent/voice/${room_id}/button", "pressed");
            } else {
              id(mqtt_client).publish("homeagent/voice/${room_id}/button", "released");
            }
          }
  - interval: 10s
    then:
      - lambda: |-
          ESP_LOGI("diag",
                   "wifi_rssi=%.0f bssid=%s ip=%s heap_free=%.0f heap_min=%.0f "
                   "heap_block=%.0f frag=%.1f loop_ms=%.0f cpu_hz=%.0f uptime=%.0f reset=%s",
                   id(office_wifi_signal).state,
                   id(office_bssid).state.c_str(),
                   id(office_ip).state.c_str(),
                   id(office_heap_free).state,
                   id(office_heap_min_free).state,
                   id(office_heap_block).state,
                   id(office_heap_fragmentation).state,
                   id(office_loop_time).state,
                   id(office_cpu_frequency).state,
                   id(office_uptime).state,
                   id(office_reset_reason).state.c_str());
