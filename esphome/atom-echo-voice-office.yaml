# ---------------------------------------------------------------
# Atom Echo Voice Mic — ESPHome firmware
#
# Streams raw 16kHz 16-bit mono PCM over UDP to the voice service.
# No on-device wake word detection; all processing is server-side.
#
# Per-device substitutions (override when flashing each unit):
#   node_name         unique device name on the network
#   friendly_name     human-readable label
#   room_id           4-char room code (sent as UDP header)
#   voice_server_ip   IP of the voice service host
#   voice_server_port UDP port the voice service listens on
#   voice_listen_port UDP port THIS device listens on for TTS audio
# ---------------------------------------------------------------

substitutions:
  node_name: "atom-echo-office"
  friendly_name: "Office Voice Mic"
  room_id: "offi"                    # 4 chars max
  voice_server_ip: "10.1.1.111"
  voice_server_port: "9100"
  voice_listen_port: "9200"          # unique per device for TTS responses

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  includes:
    - udp_streamer.h
  on_boot:
    priority: -10
    then:
      - lambda: |-
          udp_streamer_init("${voice_server_ip}", ${voice_server_port},
                            ${voice_listen_port}, "${room_id}");
          udp_streamer_start();
      - delay: 2s
      - microphone.capture: mic
      - light.turn_on:
          id: led
          red: 0%
          green: 50%
          blue: 0%
          brightness: 30%
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32_DEFAULT_CPU_FREQ_240: "y"

logger:
  logs:
    mqtt: NONE
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ----- Status LED (SK6812 NeoPixel) -----
light:
  - platform: esp32_rmt_led_strip
    id: led
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    rgb_order: GRB
    name: "Status LED"

# ----- I2S Audio Bus -----
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO33
    i2s_bclk_pin: GPIO19

# ----- Microphone (PDM) -----
microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO23
    adc_type: external
    pdm: true
    channel: right
    bits_per_sample: 16bit
    sample_rate: 16000
    on_data:
      - lambda: |-
          stream_audio_udp(x);

# ----- Speaker (for TTS responses) -----
speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO21
    dac_type: external
    mode: mono

# ----- Physical Button (GPIO39) -----
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: "Button"
    id: button
    on_press:
      then:
        # Blue = push-to-talk active
        - light.turn_on:
            id: led
            red: 0%
            green: 0%
            blue: 100%
            brightness: 80%
    on_release:
      then:
        # Back to idle green
        - light.turn_on:
            id: led
            red: 0%
            green: 50%
            blue: 0%
            brightness: 30%

# ----- MQTT (for button events + LED control from server) -----
mqtt:
  id: mqtt_client
  broker: ${voice_server_ip}
  port: 1883
  topic_prefix: "homeagent/voice/${room_id}"
  birth_message:
    topic: "homeagent/voice/${room_id}/status"
    payload: "online"
    retain: true
  will_message:
    topic: "homeagent/voice/${room_id}/status"
    payload: "offline"
    retain: true
  on_message:
    # LED control from voice service
    - topic: "homeagent/voice/${room_id}/led"
      then:
        - lambda: |-
            std::string color = x;
            if (color == "listening") {
              auto call = id(led).turn_on();
              call.set_rgb(0.0f, 0.5f, 0.0f);
              call.set_brightness(0.3f);
              call.perform();
            } else if (color == "wake") {
              auto call = id(led).turn_on();
              call.set_rgb(0.0f, 0.0f, 1.0f);
              call.set_brightness(0.8f);
              call.perform();
            } else if (color == "capturing") {
              auto call = id(led).turn_on();
              call.set_rgb(0.0f, 1.0f, 0.0f);
              call.set_brightness(0.8f);
              call.perform();
            } else if (color == "processing") {
              auto call = id(led).turn_on();
              call.set_rgb(1.0f, 0.8f, 0.0f);
              call.set_brightness(0.6f);
              call.perform();
            } else if (color == "error") {
              auto call = id(led).turn_on();
              call.set_rgb(1.0f, 0.0f, 0.0f);
              call.set_brightness(0.8f);
              call.perform();
            } else if (color == "off") {
              id(led).turn_off().perform();
            }
    # Button state published automatically by the binary_sensor,
    # but also publish explicitly for the voice service:
  on_json_message:
    topic: "homeagent/voice/${room_id}/play"
    then:
      - lambda: |-
          // Future: receive TTS audio URL or data to play on speaker
          ESP_LOGI("voice", "Play command received");

# Publish button press/release to MQTT for push-to-talk
interval:
  - interval: 50ms
    then:
      - lambda: |-
          static bool last_state = false;
          bool current = id(button).state;
          if (current != last_state) {
            last_state = current;
            if (current) {
              id(mqtt_client).publish("homeagent/voice/${room_id}/button", "pressed");
            } else {
              id(mqtt_client).publish("homeagent/voice/${room_id}/button", "released");
            }
          }
