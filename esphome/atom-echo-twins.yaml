substitutions:
  node_name: "atom-echo-twins"
  friendly_name: "Twins Room Voice Mic"
  room_id: "twin"
  voice_server_ip: "10.1.1.110"
  voice_server_port: "9100"
  voice_listen_port: "9205"
  mic_gain: "8"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  includes:
    - udp_streamer.h
  on_boot:
    priority: -10
    then:
      - lambda: |-
          udp_streamer_init("${voice_server_ip}", ${voice_server_port},
                            ${voice_listen_port}, "${room_id}");
          udp_streamer_set_gain(${mic_gain});
          udp_streamer_start();
      - delay: 2s
      - microphone.capture: mic
      - light.turn_on:
          id: led
          red: 0%
          green: 50%
          blue: 0%
          brightness: 30%
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32_DEFAULT_CPU_FREQ_240: "y"

logger:
  level: INFO
  baud_rate: 0

debug:
  update_interval: 5s

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      manual_ip:
        static_ip: 10.1.2.207
        gateway: 10.1.2.254
        subnet: 255.255.252.0
        dns1: 10.1.2.254
  power_save_mode: none
  output_power: 20.5dB

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

text_sensor:
  - platform: debug
    device:
      name: "Twins Room Voice Mic Device Info"
      entity_category: diagnostic
      id: twins_device_info
    reset_reason:
      name: "Twins Room Voice Mic Reset Reason"
      entity_category: diagnostic
      id: twins_reset_reason
  - platform: wifi_info
    ip_address:
      name: "Twins Room Voice Mic IP"
      entity_category: diagnostic
      id: twins_ip
    ssid:
      name: "Twins Room Voice Mic SSID"
      entity_category: diagnostic
      id: twins_ssid
    bssid:
      name: "Twins Room Voice Mic BSSID"
      entity_category: diagnostic
      id: twins_bssid
    mac_address:
      name: "Twins Room Voice Mic MAC"
      entity_category: diagnostic
      id: twins_mac

sensor:
  - platform: wifi_signal
    name: "Twins Room Voice Mic WiFi Signal"
    update_interval: 15s
    entity_category: diagnostic
    id: twins_wifi_signal
  - platform: uptime
    name: "Twins Room Voice Mic Uptime"
    update_interval: 15s
    entity_category: diagnostic
    id: twins_uptime
  - platform: debug
    free:
      name: "Twins Room Voice Mic Heap Free"
      entity_category: diagnostic
      id: twins_heap_free
    block:
      name: "Twins Room Voice Mic Heap Max Block"
      entity_category: diagnostic
      id: twins_heap_block
    min_free:
      name: "Twins Room Voice Mic Heap Min Free"
      entity_category: diagnostic
      id: twins_heap_min_free
    fragmentation:
      name: "Twins Room Voice Mic Heap Fragmentation"
      entity_category: diagnostic
      id: twins_heap_fragmentation
    loop_time:
      name: "Twins Room Voice Mic Loop Time"
      entity_category: diagnostic
      id: twins_loop_time
    cpu_frequency:
      name: "Twins Room Voice Mic CPU Frequency"
      entity_category: diagnostic
      id: twins_cpu_frequency

light:
  - platform: esp32_rmt_led_strip
    id: led
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    rgb_order: GRB
    name: "Status LED"

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO33
    i2s_bclk_pin: GPIO19

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO23
    adc_type: external
    pdm: true
    channel: right
    bits_per_sample: 16bit
    sample_rate: 16000
    on_data:
      - lambda: |-
          stream_audio_udp(x);

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO21
    dac_type: external
    i2s_mode: primary

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: "Button"
    id: button
    on_press:
      then:
        - light.turn_on:
            id: led
            red: 0%
            green: 0%
            blue: 100%
            brightness: 80%
    on_release:
      then:
        - light.turn_on:
            id: led
            red: 0%
            green: 50%
            blue: 0%
            brightness: 30%

mqtt:
  id: mqtt_client
  broker: ${voice_server_ip}
  port: 1883
  topic_prefix: "homeagent/voice/${room_id}"
  birth_message:
    topic: "homeagent/voice/${room_id}/status"
    payload: "online"
    retain: true
  will_message:
    topic: "homeagent/voice/${room_id}/status"
    payload: "offline"
    retain: true
  on_message:
    - topic: "homeagent/voice/${room_id}/led"
      then:
        - lambda: |-
            std::string color = x;
            if (color == "listening") {
              auto call = id(led).turn_on();
              call.set_rgb(0.0f, 0.5f, 0.0f);
              call.set_brightness(0.3f);
              call.perform();
            } else if (color == "wake") {
              auto call = id(led).turn_on();
              call.set_rgb(0.0f, 0.0f, 1.0f);
              call.set_brightness(0.8f);
              call.perform();
            } else if (color == "capturing") {
              auto call = id(led).turn_on();
              call.set_rgb(0.0f, 1.0f, 0.0f);
              call.set_brightness(0.8f);
              call.perform();
            } else if (color == "processing") {
              auto call = id(led).turn_on();
              call.set_rgb(1.0f, 0.8f, 0.0f);
              call.set_brightness(0.6f);
              call.perform();
            } else if (color == "error") {
              auto call = id(led).turn_on();
              call.set_rgb(1.0f, 0.0f, 0.0f);
              call.set_brightness(0.8f);
              call.perform();
            } else if (color == "off") {
              id(led).turn_off().perform();
            }

interval:
  - interval: 10s
    then:
      - lambda: |-
          ESP_LOGI(
            "diag",
            "wifi_rssi=%.0f bssid=%s ip=%s heap_free=%.0f heap_min=%.0f heap_block=%.0f frag=%.1f loop_ms=%.0f cpu_hz=%.0f uptime=%.0f reset=%s",
            id(twins_wifi_signal).state,
            id(twins_bssid).state.c_str(),
            id(twins_ip).state.c_str(),
            id(twins_heap_free).state,
            id(twins_heap_min_free).state,
            id(twins_heap_block).state,
            id(twins_heap_fragmentation).state,
            id(twins_loop_time).state,
            id(twins_cpu_frequency).state,
            id(twins_uptime).state,
            id(twins_reset_reason).state.c_str()
          );
  - interval: 200ms
    then:
      - lambda: |-
          static bool last_state = false;
          bool current = id(button).state;
          if (current != last_state) {
            last_state = current;
            if (current) {
              id(mqtt_client).publish("homeagent/voice/${room_id}/button", "pressed");
            } else {
              id(mqtt_client).publish("homeagent/voice/${room_id}/button", "released");
            }
          }
